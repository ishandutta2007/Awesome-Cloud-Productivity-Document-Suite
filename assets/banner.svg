<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b19" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.05" />
    </linearGradient>

    <linearGradient id="cardGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.05" />
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="subGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>

    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.1" />
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="cardGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <style>
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 40px;
      fill: url(#titleGrad);
      letter-spacing: -0.5px;
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 18px;
      fill: url(#subGrad);
      letter-spacing: 0.2px;
    }
    .tagline-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-size: 14px;
      fill: #94a3b8;
    }
    .pill-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #e0e7ff;
    }
    .metric-value {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 700;
      font-size: 16px;
      fill: #38bdf8;
    }
    .metric-label {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-size: 11px;
      fill: #64748b;
    }

    /* CSS Animations for dynamic elements in background */
    @keyframes pulseOrb1 {
      0%, 100% { transform: translate(0px, 0px) scale(1); opacity: 0.35; }
      50% { transform: translate(40px, -25px) scale(1.15); opacity: 0.6; }
    }
    @keyframes pulseOrb2 {
      0%, 100% { transform: translate(0px, 0px) scale(1); opacity: 0.25; }
      50% { transform: translate(-30px, 30px) scale(1.2); opacity: 0.5; }
    }
    @keyframes floatCard1 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
    }
    @keyframes floatCard2 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(8px); }
    }
    @keyframes dashTravel {
      to { stroke-dashoffset: -40; }
    }

    .orb-anim-1 { animation: pulseOrb1 9s ease-in-out infinite; }
    .orb-anim-2 { animation: pulseOrb2 11s ease-in-out infinite; }
    .float-1 { animation: floatCard1 6s ease-in-out infinite; }
    .float-2 { animation: floatCard2 7s ease-in-out infinite; }
    .stream-line {
      stroke-dasharray: 6 6;
      animation: dashTravel 2s linear infinite;
    }
  </style>

  <!-- Deep Canvas Background -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)" />

  <!-- Subtle Matrix Grid -->
  <g opacity="0.12">
    <path d="M0 60 H1200 M0 120 H1200 M0 180 H1200 M0 240 H1200 M0 300 H1200 M0 360 H1200" stroke="#38bdf8" stroke-width="1" />
    <path d="M120 0 V420 M240 0 V420 M360 0 V420 M480 0 V420 M600 0 V420 M720 0 V420 M840 0 V420 M960 0 V420 M1080 0 V420" stroke="#38bdf8" stroke-width="1" />
  </g>

  <!-- Dynamic Glowing Orbs (strictly background) -->
  <g filter="url(#glow)">
    <circle cx="200" cy="90" r="130" fill="#0284c7" class="orb-anim-1" />
    <circle cx="1020" cy="180" r="160" fill="#7c3aed" class="orb-anim-2" />
    <circle cx="620" cy="380" r="120" fill="#0d9488" class="orb-anim-1" />
  </g>

  <!-- Ambient Dynamic Floating Data Nodes on Right Side (Keeps Left/Center Unobscured) -->
  <g class="float-1" transform="translate(860, 50)" filter="url(#cardGlow)">
    <rect width="280" height="110" rx="14" fill="#0f172a" fill-opacity="0.85" stroke="#38bdf8" stroke-opacity="0.35" stroke-width="1.5" />
    <circle cx="36" cy="38" r="16" fill="#38bdf8" fill-opacity="0.2" />
    <text x="36" y="44" font-size="16" text-anchor="middle">☁️</text>
    <text x="64" y="36" class="metric-value">Real-Time Cloud Hub</text>
    <text x="64" y="52" class="metric-label">Google Workspace • M365 • Zoho</text>
    <line x1="24" y1="72" x2="256" y2="72" stroke="#334155" stroke-width="1" />
    <text x="24" y="92" font-size="11" fill="#10b981" font-weight="600">● 99.99% Availability</text>
    <text x="256" y="92" font-size="11" fill="#94a3b8" text-anchor="end">SaaS Titans</text>
  </g>

  <g class="float-2" transform="translate(860, 190)" filter="url(#cardGlow)">
    <rect width="280" height="110" rx="14" fill="#0f172a" fill-opacity="0.85" stroke="#a855f7" stroke-opacity="0.35" stroke-width="1.5" />
    <circle cx="36" cy="38" r="16" fill="#a855f7" fill-opacity="0.2" />
    <text x="36" y="44" font-size="16" text-anchor="middle">🛡️</text>
    <text x="64" y="36" class="metric-value" fill="#c084fc">Sovereign &amp; Local-First</text>
    <text x="64" y="52" class="metric-label">AppFlowy • AFFiNE • ONLYOFFICE</text>
    <line x1="24" y1="72" x2="256" y2="72" stroke="#334155" stroke-width="1" />
    <text x="24" y="92" font-size="11" fill="#38bdf8" font-weight="600">🔒 100% Data Ownership</text>
    <text x="256" y="92" font-size="11" fill="#94a3b8" text-anchor="end">Open Source</text>
  </g>

  <!-- Dynamic Connecting Stream Lines -->
  <path d="M 860 105 C 780 105, 780 245, 860 245" fill="none" stroke="#6366f1" stroke-width="2" stroke-opacity="0.6" class="stream-line" />

  <!-- FOREGROUND CONTENT: Header, Titles, Subtitles, Feature Badges -->
  <!-- Header Badge -->
  <g transform="translate(70, 52)">
    <rect width="320" height="34" rx="17" fill="url(#badgeGrad)" stroke="#6366f1" stroke-opacity="0.5" stroke-width="1.2" />
    <circle cx="18" cy="17" r="5" fill="#10b981">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="32" y="22" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#a5b4fc" letter-spacing="1">CURATED ECOSYSTEM 2026</text>
    <text x="296" y="23" font-size="13">✨</text>
  </g>

  <!-- Title & Subtitle (Crisp Foreground, No Overlaps) -->
  <text x="70" y="132" class="title-text">Awesome Cloud Productivity</text>
  <text x="70" y="174" class="title-text">&amp; Document Suite</text>

  <text x="70" y="218" class="subtitle-text">The Ultimate Guide to Real-Time Collaborative Workspaces &amp; Self-Hosted Suites</text>
  <text x="70" y="246" class="tagline-text">Comprehensive comparison of SaaS powerhouses and open-source sovereign office platforms.</text>

  <!-- Dynamic Category Feature Pills in Foreground -->
  <g transform="translate(70, 280)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="160" height="38" rx="19" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.7" />
    <text x="18" y="24" font-size="15">📊</text>
    <text x="44" y="24" class="pill-text">Office Suites</text>

    <!-- Pill 2 -->
    <rect x="175" y="0" width="175" height="38" rx="19" fill="#1e293b" stroke="#818cf8" stroke-width="1.2" stroke-opacity="0.7" />
    <text x="193" y="24" font-size="15">🤝</text>
    <text x="219" y="24" class="pill-text">Team Wikis &amp; Docs</text>

    <!-- Pill 3 -->
    <rect x="365" y="0" width="180" height="38" rx="19" fill="#1e293b" stroke="#a855f7" stroke-width="1.2" stroke-opacity="0.7" />
    <text x="383" y="24" font-size="15">🔒</text>
    <text x="409" y="24" class="pill-text">Data Sovereignty</text>

    <!-- Pill 4 -->
    <rect x="560" y="0" width="165" height="38" rx="19" fill="#1e293b" stroke="#34d399" stroke-width="1.2" stroke-opacity="0.7" />
    <text x="578" y="24" font-size="15">⚡</text>
    <text x="604" y="24" class="pill-text">AI Workspaces</text>
  </g>

  <!-- Metric Badges Row -->
  <g transform="translate(70, 345)">
    <text x="0" y="16" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#64748b">POPULAR STACKS:</text>
    <text x="120" y="16" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#94a3b8">Microsoft 365 • Google Workspace • ONLYOFFICE • AppFlowy • Notion • Nextcloud • AFFiNE • LibreOffice</text>
  </g>
</svg>
